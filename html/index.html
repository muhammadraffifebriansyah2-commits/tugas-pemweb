<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Samudra Nusantara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="halaman-login">

  <!-- ===== Langit, matahari, dan awan ===== -->
  <div class="langit" aria-hidden="true">
    <div class="matahari"></div>
    <div class="awan awan-1"></div>
    <div class="awan awan-2"></div>
  </div>

  <!-- ===== Kartu login ===== -->
  <main class="panggung">
    <section class="kartu">
      <p class="kartu-kop">Samudra Nusantara</p>
      <h1>Selamat datang, penyelam.</h1>
      <p class="kartu-sub">Masuk untuk mulai menjelajahi biota laut dari tepi pantai sampai palung terdalam.</p>

      <form action="biota.html" method="get" class="form">
        <div class="baris">
          <label for="nama">Nama pengguna</label>
          <input type="text" id="nama" name="nama" placeholder="mis. nadia.laut" required>
        </div>

        <div class="baris">
          <label for="sandi">Kata sandi</label>
          <input type="password" id="sandi" name="sandi" placeholder="Minimal 8 karakter" required minlength="8">
        </div>

        <div class="baris-mendatar">
          <label class="ingat">
            <input type="checkbox" name="ingat">
            <span>Ingat saya</span>
          </label>
          <a href="#" class="tautan-kecil">Lupa kata sandi?</a>
        </div>

        <button type="submit" class="tombol">Masuk dan menyelam</button>
      </form>

      <p class="kaki-kartu">Belum punya akun? <a href="#">Daftar gratis</a></p>
    </section>
  </main>

  <!-- ===== Laut dan pasir pantai ===== -->
  <div class="laut" aria-hidden="true">
    <svg class="ombak" viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,60 C180,110 360,10 540,50 C720,90 900,20 1080,55 C1260,90 1380,70 1440,60 L1440,120 L0,120 Z"></path>
    </svg>
    <div class="air">
      <span class="gelembung g1"></span>
      <span class="gelembung g2"></span>
      <span class="gelembung g3"></span>
      <span class="gelembung g4"></span>
    </div>
    <div class="pasir">
      <span class="kerang">🐚</span>
      <span class="kerang kerang-2">⭐</span>
    </div>
  </div>

</body>
</html>
